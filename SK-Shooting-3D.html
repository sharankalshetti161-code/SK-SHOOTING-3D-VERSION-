<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>SK Shooting 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#000;font-family:Arial,sans-serif;touch-action:none}#game{position:fixed;inset:0}#ui{position:fixed;top:12px;left:12px;color:white;font-size:18px;font-weight:bold;z-index:5;text-shadow:2px 2px 3px #000}#crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font-size:30px;z-index:4}#shoot{position:fixed;right:25px;bottom:35px;width:90px;height:90px;border-radius:50%;border:3px solid white;background:rgba(220,30,30,.75);color:white;font-size:18px;font-weight:bold;z-index:6}#left,#right,#forward,#back{position:fixed;width:55px;height:55px;border-radius:15px;border:2px solid white;background:rgba(0,0,0,.45);color:white;font-size:25px;z-index:6}#forward{left:80px;bottom:135px}#left{left:20px;bottom:75px}#back{left:80px;bottom:15px}#right{left:140px;bottom:75px}#gameover{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);color:white;z-index:20;text-align:center;padding-top:30vh}#gameover h1{font-size:42px}#restart{padding:15px 30px;font-size:20px;border:0;border-radius:10px}
</style></head><body>
<div id="game"></div><div id="ui">❤️ Health: <span id="health">100</span><br>🏆 Score: <span id="score">0</span></div><div id="crosshair">+</div>
<button id="forward">▲</button><button id="left">◀</button><button id="back">▼</button><button id="right">▶</button><button id="shoot">FIRE</button>
<div id="gameover"><h1>SK SHOOTING</h1><h2>GAME OVER</h2><p>Score: <span id="finalScore">0</span></p><button id="restart">RESTART</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
let scene,camera,renderer,player,enemies=[],bullets=[],health=100,score=0,gameRunning=true;const keys={forward:false,back:false,left:false,right:false};
scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);camera.position.set(0,2,8);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById("game").appendChild(renderer.domElement);
const sunlight=new THREE.DirectionalLight(0xffffff,1.5);sunlight.position.set(10,20,10);sunlight.castShadow=true;scene.add(sunlight);scene.add(new THREE.AmbientLight(0xffffff,.5));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x3b7d3b}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
player=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,.7),new THREE.MeshStandardMaterial({color:0x2266cc}));body.position.y=1.3;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,16),new THREE.MeshStandardMaterial({color:0xffc49b}));head.position.y=2.35;head.castShadow=true;player.add(head);const gun=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,1.2),new THREE.MeshStandardMaterial({color:0x222222}));gun.position.set(.45,1.45,-.65);gun.rotation.x=-.05;player.add(gun);player.position.set(0,0,8);scene.add(player);
function createBox(x,z,w,h,d,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color}));m.position.set(x,h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m)}createBox(-8,-10,3,4,3,0x777777);createBox(8,-15,4,5,4,0x777777);createBox(-12,8,4,3,4,0x8b4513);createBox(12,5,4,4,4,0x8b4513);createBox(0,-25,8,5,3,0x666666);
function createEnemy(){const e=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,.7),new THREE.MeshStandardMaterial({color:0xcc2222}));b.position.y=1.2;e.add(b);const h=new THREE.Mesh(new THREE.SphereGeometry(.4,16,16),new THREE.MeshStandardMaterial({color:0xffaa88}));h.position.y=2.25;e.add(h);e.position.set((Math.random()-.5)*35,0,-10-Math.random()*30);e.userData.hp=2;scene.add(e);enemies.push(e)}for(let i=0;i<8;i++)createEnemy();
function shoot(){if(!gameRunning)return;const b=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),new THREE.MeshBasicMaterial({color:0xffff00}));b.position.copy(camera.position);const d=new THREE.Vector3();camera.getWorldDirection(d);b.userData.velocity=d.multiplyScalar(.7);scene.add(b);bullets.push(b)}
function updatePlayer(){if(!gameRunning)return;const s=.18;if(keys.forward)player.position.z-=s;if(keys.back)player.position.z+=s;if(keys.left)player.position.x-=s;if(keys.right)player.position.x+=s;camera.position.x=player.position.x;camera.position.z=player.position.z+7;camera.lookAt(player.position.x,1.6,player.position.z-10)}
function updateBullets(){for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.position.add(b.userData.velocity);let hit=false;for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(b.position.distanceTo(e.position)<1.5){e.userData.hp--;scene.remove(b);bullets.splice(i,1);hit=true;if(e.userData.hp<=0){scene.remove(e);enemies.splice(j,1);score+=10;document.getElementById("score").textContent=score;setTimeout(createEnemy,1000)}break}}if(!hit&&b.position.length()>200){scene.remove(b);bullets.splice(i,1)}}}
function updateEnemies(){enemies.forEach(e=>{const dx=player.position.x-e.position.x,dz=player.position.z-e.position.z,dist=Math.sqrt(dx*dx+dz*dz);if(dist>2){e.position.x+=dx/dist*.025;e.position.z+=dz/dist*.025}else{health-=.08;document.getElementById("health").textContent=Math.max(0,Math.floor(health));if(health<=0)endGame()}e.lookAt(player.position.x,1,player.position.z)})}
function endGame(){gameRunning=false;document.getElementById("finalScore").textContent=score;document.getElementById("gameover").style.display="block"}
function hold(id,key){const el=document.getElementById(id);el.addEventListener("touchstart",e=>{e.preventDefault();keys[key]=true});el.addEventListener("touchend",e=>{e.preventDefault();keys[key]=false});el.addEventListener("mousedown",()=>keys[key]=true);el.addEventListener("mouseup",()=>keys[key]=false)}
hold("forward","forward");hold("back","back");hold("left","left");hold("right","right");document.getElementById("shoot").addEventListener("touchstart",e=>{e.preventDefault();shoot()});document.getElementById("shoot").addEventListener("mousedown",shoot);document.getElementById("restart").onclick=()=>location.reload();window.addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);updatePlayer();updateBullets();updateEnemies();renderer.render(scene,camera)}animate();
</script></body></html>
